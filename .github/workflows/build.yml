name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже есть на сборочной машине GitHub; только принимаем лицензии
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VoiceAnswer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAnswer-apk
          path: VoiceAnswer.apk

      # Публикуем APK на странице Releases — оттуда его удобно скачать прямо с телефона
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VoiceAnswer (последняя сборка)
          body: "Автоматическая сборка из ветки main. Скачайте VoiceAnswer.apk и установите."
          files: VoiceAnswer.apk
          make_latest: true
